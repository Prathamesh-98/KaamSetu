name: KaamSetu Android APK
on:
  push:
    branches: [android-capacitor]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false @capacitor/core@7.0.0 @capacitor/cli@7.0.0 @capacitor/android@7.0.0
      - name: Build web assets
        env:
          VITE_API_BASE_URL: https://kaamsetu-api-staging.onrender.com
        run: npm run build
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Compile debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../KaamSetu.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KaamSetu-Android-APK
          path: frontend/KaamSetu.apk
          if-no-files-found: error
          retention-days: 14
