name: Backend security review
on:
  push:
    branches: [backend-security-review]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: kaamsetu_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:ci-only-password@127.0.0.1:5432/kaamsetu_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci-only-password@127.0.0.1:5432/kaamsetu_test
      PGPASSWORD: ci-only-password
      ENVIRONMENT: development
      JWT_SECRET_KEY: ci-only-not-production-secret
      MOCK_OTP_MODE: 'true'
      FRONTEND_URL: https://kaamsetu-frontend-jxpg.onrender.com
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt pip-audit
      - run: pip check
      - run: pip-audit
        continue-on-error: true
      - name: Initialize isolated database
        run: |
          alembic upgrade head
          psql -h 127.0.0.1 -U postgres -d kaamsetu_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role BYPASSRLS; GRANT ALL ON ALL TABLES IN SCHEMA public TO anon, authenticated, service_role;'
      - name: Verify rollback and apply protection
        run: |
          psql -h 127.0.0.1 -U postgres -d kaamsetu_test -v ON_ERROR_STOP=1 -f ../security-review/database-up.sql
          psql -h 127.0.0.1 -U postgres -d kaamsetu_test -v ON_ERROR_STOP=1 -f ../security-review/database-down.sql
          psql -h 127.0.0.1 -U postgres -d kaamsetu_test -v ON_ERROR_STOP=1 -f ../security-review/database-up.sql
          psql -h 127.0.0.1 -U postgres -d kaamsetu_test -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF EXISTS (SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind='r' AND (NOT c.relrowsecurity OR has_table_privilege('anon',c.oid,'SELECT') OR has_table_privilege('authenticated',c.oid,'SELECT'))) THEN RAISE EXCEPTION 'Protection incomplete'; END IF; END \$\$;"
      - name: Regression suite
        run: python -m pytest tests -q --maxfail=10
